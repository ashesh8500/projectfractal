<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WASM Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebAssembly Test</h1>
        <p>This is a simple test of WebAssembly functionality.</p>
        <input type="text" id="name" placeholder="Enter your name" value="Portfolio Optimizer">
        <button id="greet-button">Greet</button>
        <div id="result"></div>
    </div>

    <script type="module">
        import init, { greet, add } from './pkg/wasm_test.js';

        async function run() {
            await init();
            
            document.getElementById('greet-button').addEventListener('click', () => {
                const name = document.getElementById('name').value;
                const result = greet(name);
                document.getElementById('result').textContent = result;
                
                // Also test the add function
                const sum = add(40, 2);
                document.getElementById('result').textContent += `\nThe answer is: ${sum}`;
            });
        }

        run();
    </script>
</body>
</html>
