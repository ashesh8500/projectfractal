[package]
name = "portfolio_frontend"
version = "0.1.0"
edition = "2021"

# Both lib and bin targets
[[bin]]
name = "portfolio_frontend_bin"
path = "src/main.rs"

[lib]
name = "portfolio_frontend"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Common dependencies for all targets
[dependencies]
egui = "0.27.2"
eframe = { version = "0.27.2", features = ["default_fonts", "persistence"] }
egui_plot = "0.27.2"
prost = "0.10.4"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.4"
futures = "0.3"
futures-util = "0.3"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tonic = { version = "0.7.2", features = ["codegen"] }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "sync", "time"] }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
tracing-wasm = "0.2.1"
tonic-web-wasm-client = "0.7.1"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "PerformanceTiming",
    "console",
    "Location",
    "Storage",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Blob"
]}

[build-dependencies]
tonic-build = "0.7.2"
