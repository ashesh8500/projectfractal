<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio Optimizer Pro - Advanced</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1e1e28;
        }
        canvas {
            display: block;
            outline: none;
            width: 100% !important;
            height: 100% !important;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
            font-family: Arial, sans-serif;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(100, 150, 255, 0.3);
            border-radius: 50%;
            border-top-color: rgba(100, 150, 255, 1);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="portfolio_app_canvas" class="loading">
        <div class="spinner"></div>
        <div>Loading Portfolio Optimizer Pro...</div>
    </div>
    <script>
        // This will be replaced by trunk with the actual path to the JS file
        window.addEventListener("load", () => {
            // Initialize the WASM app once everything is loaded
            window.wasm_bindgen('./portfolio_frontend_bg.wasm')
                .then(module => {
                    // Clear the loading indicator
                    document.getElementById('portfolio_app_canvas').innerHTML = '';
                    // Start the app
                    module.start_app();
                })
                .catch(e => {
                    console.error("Error loading WASM:", e);
                    document.getElementById('portfolio_app_canvas').innerHTML = 
                        '<div style="color: red;">Failed to load application. Please check console for errors.</div>';
                });
        });
    </script>
</body>
</html>
